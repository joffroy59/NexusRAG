# NexusRAG — Dev services only (PostgreSQL + ChromaDB)
# Usage: docker compose -f docker-compose.services.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexusrag-postgres-wsl
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexusrag
    ports:
      - "5443:5432"
    volumes:
      - nexusrag_postgres_data_wsl:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: nexusrag-chromadb-wsl
    ports:
      - "8012:8000"
    volumes:
      - nexusrag_chroma_data_wsl_wsl:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  nexusrag_postgres_data_wsl:
  nexusrag_chroma_data_wsl:
